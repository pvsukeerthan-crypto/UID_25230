<!DOCTYPE html>
<html>
    <body style="background-color:  #BFC1CF;">
        <h1>College Admission Registration</h1>
        <table border="1" width="500"  cellpadding="15" style="background-color: aliceblue;" align= "center">
            <tr>
                <form>
                <td><label for="fname" style="cursor: pointer;">Full Name:</label></td>
                <td><input type="text" name="full name" id="fname" size="30"></td>
                </form>
            </tr>
            <tr>
                <form>
                <td><label for="email" style="cursor: pointer;">Email:</label></td>
                <td><input type="email" name="email" id="email" size="30"></td>
                </form>
            </tr>
            <tr>
                <form>
                <td><label for="phonenumber"  style="cursor: pointer;">Phone Number:</label></td>
                <td><input type="number" name="phone number" id="phonenumber" size="30"></td>
                </form>
            </tr>
            <tr>
                <form>
                <td><label for="gender" style="cursor: pointer;">Gender</label></td>
                <td><input type="radio" name="gender" id="gender" value="gender">Male
                <input type="radio" name="gender" id="gender" value="gender">Female
                <input type="radio" name="gender" id="gender" value="gender">Others</td>
                </form>
            </tr>
            <tr>
                <form>
                <td><label for="course" style="cursor: pointer;">Course Applying For:</label></td>
                <td>
                    <select id="course">
                    <option value="">B.Tech</option>
                    <option value="CSE">
                    <option value="ECE">ECE</option>
                    <option value="IT">IT</option>
                    <option value="CCE">CCE</option>
                    </select>
                </td>
            <tr>
                <form>
                <td><label for="hobbies" style="cursor: pointer;">Hobbies</label></td>
                <td><input type="checkbox">Reading
                <input type="checkbox">Sports
                <input type="checkbox">Music</td>
                </form>
            </tr>
            <tr>
                <form>
                <td><label for="dob" style="cursor: pointer;">Date of Birth</label></td>
                <td><input type="date" name="dob" id="dob"></td>
                </form>
            </tr>
            <tr>
                <form>
                <td><label for="file" style="cursor: pointer;">Upload Certificates:</label></td>
                <td><input type="file" name="Certificates" id="file" multiple></td>
                </form>
            </tr>
            <tr>
                <form>
                <td><label for="address"style="cursor: pointer;">Address</label></td>
                <td><textarea rows="5" cols="30"></textarea></td>
                </form>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;"><button type="submit" >Submit</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>
        </table>
    </body>
</html>
