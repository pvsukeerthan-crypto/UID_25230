<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: antiquewhite;
        }

        .container {
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            grid-template-columns: 220px auto;
            grid-template-areas: 
                "header header"
                "sale sale"
                "sidebar products"
                "footer footer";
            height: 100vh;
            gap: 8px;
        }

        .header {
            grid-area: header;
            background-color: aqua;
            color: red;
            font-weight: bold;
            padding: 15px;
            font-size: 20px;
        }

        .sale {
            grid-area: sale;
            background-color: yellow;
            padding: 10px;
            font-weight: bold;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: lavender;
            padding: 15px;
        }

        .sidebar a {
            display: block;
            color: red;
            text-decoration: none;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: lightpink;
            color: brown;
        }

        .products {
            grid-area: products;
            height: 100%;
        }

        .contentframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            grid-area: footer;
            background-color: black;
            color: white;
            padding: 10px;
        }

    </style>
    <title>My E-Commerce Store</title>
</head>

<body>

<div class="container">

    <div class="header">
        My E-Commerce Store
    </div>

    <div class="sale">
         Big Sale Today!
    </div>

    <div class="sidebar">
        <a href="week6_1el.html" target="homepage">Electronics</a>
        <a href="week6_1ha.html" target="homepage">Home Appliances</a>
        <a href="week6_1bok.html" target="homepage">Books</a>
    </div>

    <div class="products">
        <iframe name="homepage" class="contentframe"></iframe>
    </div>

    <div class="footer">
        © 2026 My Store | All Rights Reserved
    </div>

</div>

</body>
</html>
